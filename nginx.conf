    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name assets.apexingoodcompany.co.uk;

    ssl_certificate /etc/letsencrypt/live/assets.apexingoodcompany.co.uk/fullchain.pem;
