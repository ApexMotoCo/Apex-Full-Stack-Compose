# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name apexingoodcompany.co.uk www.apexingoodcompany.co.uk vpn.apexingoodcompany.co.uk assets.apexingoodcompany.co.uk dashboard.apexingoodcompany.co.uk;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Dashboard
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dashboard.apexingoodcompany.co.uk;

    ssl_certificate /etc/letsencrypt/live/dashboard.apexingoodcompany.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.apexingoodcompany.co.uk/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/dashboard.apexingoodcompany.co.uk/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location /images/ {
        alias /dashboard-public/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://apex-monitoring-dashboard:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cookie_path / /;
        proxy_cookie_domain ~^(.*)$ "$host";
        proxy_cookie_flags ~ secure httponly samesite=none;
    }
}

# Main Domain
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name apexingoodcompany.co.uk www.apexingoodcompany.co.uk;

    ssl_certificate /etc/letsencrypt/live/apexingoodcompany.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apexingoodcompany.co.uk/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/apexingoodcompany.co.uk/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://apex-moto-co-web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
    }
}

# VPN Service
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vpn.apexingoodcompany.co.uk;

    ssl_certificate /etc/letsencrypt/live/vpn.apexingoodcompany.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vpn.apexingoodcompany.co.uk/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/vpn.apexingoodcompany.co.uk/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass https://apex-openvpn:943;
        proxy_http_version 1.1;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Asset Management
