# Test - Dashboard only
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dashboard.apexingoodcompany.co.uk;

    ssl_certificate /etc/letsencrypt/live/dashboard.apexingoodcompany.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.apexingoodcompany.co.uk/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/dashboard.apexingoodcompany.co.uk/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://172.21.0.4:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name _;
    location / {
        return 301 https://$host$request_uri;
    }
}
