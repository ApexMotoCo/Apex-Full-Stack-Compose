<svg viewBox="0 0 1400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B35;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main text with gradient fill -->
  <text x="80" y="240" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="url(#orangeGrad)" filter="url(#shadow)" letter-spacing="2">
    Apex
  </text>
  
  <!-- Decorative line under Apex -->
  <line x1="80" y1="260" x2="480" y2="260" stroke="url(#orangeGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Asset Management subtitle -->
  <text x="520" y="180" font-family="Arial, sans-serif" font-size="90" font-weight="bold" fill="url(#orangeGrad)" filter="url(#shadow)" letter-spacing="1">
    Asset
  </text>
  <text x="520" y="280" font-family="Arial, sans-serif" font-size="90" font-weight="bold" fill="url(#orangeGrad)" filter="url(#shadow)" letter-spacing="1">
    Management
  </text>
  
  <!-- Accent line on right -->
  <line x1="1300" y1="140" x2="1300" y2="320" stroke="url(#orangeGrad)" stroke-width="4" stroke-linecap="round"/>
</svg>