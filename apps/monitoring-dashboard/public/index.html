<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/images/Logo.png">
  <link rel="apple-touch-icon" href="/images/Logo.png">
  <title>Apex Dashboard - Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --apex-primary: #ff6b35;
      --apex-secondary: #004e89;
      --apex-accent: #f7931e;
      --apex-dark: #0a0e27;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--apex-dark) 0%, #1a2a4e 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 420px;
      padding: 50px 40px;
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-section {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-img {
      max-width: 300px;
      width: 100%;
      height: auto;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.8em;
      color: var(--apex-dark);
      margin-bottom: 10px;
    }

    .subtitle {
      color: #999;
      font-size: 0.95em;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--apex-dark);
      font-weight: 600;
      font-size: 0.95em;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e6ed;
      border-radius: 8px;
      font-size: 1em;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    input:focus {
      outline: none;
      border-color: var(--apex-primary);
      box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
    }

    input::placeholder {
      color: #ccc;
    }

    .email-hint {
      font-size: 0.85em;
      color: #999;
      margin-top: 5px;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--apex-primary) 0%, var(--apex-accent) 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1em;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 107, 53, 0.3);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-message {
      background: #f8d7da;
      color: #721c24;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      border-left: 4px solid #721c24;
    }

    .error-message.show {
      display: block;
      animation: slideDown 0.3s ease-out;
    }

    .success-message {
      background: #d4edda;
      color: #155724;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      border-left: 4px solid #155724;
    }

    .success-message.show {
      display: block;
      animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .toggle-register {
      text-align: center;
      margin-top: 20px;
      color: #999;
      font-size: 0.95em;
    }

    .toggle-register a {
      color: var(--apex-primary);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    .toggle-register a:hover {
      text-decoration: underline;
    }

    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
    }

    .loading {
      display: none;
      text-align: center;
      color: var(--apex-primary);
      font-weight: 600;
    }

    .loading.show {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid var(--apex-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #e0e6ed;
      color: #999;
      font-size: 0.85em;
    }

    .footer strong {
      color: var(--apex-primary);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo-section">
      <img src="/images/Logo.png" alt="Apex Logo" class="logo-img">
      <h1>System Monitor</h1>
      <p class="subtitle">Apex In Good Company</p>
    </div>

    <!-- Login Form -->
    <div id="loginForm" class="form-section active">
      <div id="loginError" class="error-message"></div>
      <div id="loginSuccess" class="success-message"></div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="you@apexingoodcompany.co.uk" required>
          <div class="email-hint">Must be @apexingoodcompany.co.uk email</div>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Enter your password" required>
        </div>

        <div class="loading" id="loginLoading">
          <span class="spinner"></span> Logging in...
        </div>

        <button type="submit" class="btn-login" id="loginBtn">Login</button>

        <div class="toggle-register">
          Don't have an account? <a onclick="toggleForms()">Register here</a>
        </div>
      </form>
    </div>

    <!-- Register Form -->
    <div id="registerForm" class="form-section">
      <div id="registerError" class="error-message"></div>
      <div id="registerSuccess" class="success-message"></div>

      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="registerName">Full Name</label>
          <input type="text" id="registerName" placeholder="Your Name" required>
        </div>

        <div class="form-group">
          <label for="registerEmail">Email</label>
          <input type="email" id="registerEmail" placeholder="you@apexingoodcompany.co.uk" required>
          <div class="email-hint">Must be @apexingoodcompany.co.uk email</div>
        </div>

        <div class="form-group">
          <label for="registerPassword">Password</label>
          <input type="password" id="registerPassword" placeholder="At least 8 characters" minlength="8" required>
        </div>

        <div class="form-group">
          <label for="registerConfirm">Confirm Password</label>
          <input type="password" id="registerConfirm" placeholder="Confirm your password" required>
        </div>

        <div class="loading" id="registerLoading">
          <span class="spinner"></span> Creating account...
        </div>

        <button type="submit" class="btn-login" id="registerBtn">Register</button>

        <div class="toggle-register">
          Already have an account? <a onclick="toggleForms()">Login here</a>
        </div>
      </form>
    </div>

    <div class="footer">
      <strong>⚡ Apex In Good Company</strong><br>
      Secure Monitoring Dashboard v1.0
    </div>
  </div>

  <script>
    function toggleForms() {
      document.getElementById('loginForm').classList.toggle('active');
      document.getElementById('registerForm').classList.toggle('active');
      clearMessages();
    }

    function clearMessages() {
      document.querySelectorAll('.error-message, .success-message').forEach(el => {
        el.classList.remove('show');
        el.textContent = '';
      });
    }

    function showMessage(elementId, message, isError = true) {
      const el = document.getElementById(elementId);
      el.textContent = message;
      el.classList.add('show');
      if (!isError) {
        el.classList.remove('error-message');
        el.classList.add('success-message');
      }
      setTimeout(() => el.classList.remove('show'), 5000);
    }

    async function handleLogin(event) {
      event.preventDefault();
      alert('Login form submitted');
      clearMessages();

      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const loginBtn = document.getElementById('loginBtn');
      const loginLoading = document.getElementById('loginLoading');

      // Validate email domain
      if (!email.endsWith('@apexingoodcompany.co.uk')) {
        showMessage('loginError', '❌ Only @apexingoodcompany.co.uk emails are allowed');
        return;
      }

      loginBtn.disabled = true;
      loginLoading.classList.add('show');

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        console.log('Response status:', response.status);

        const data = await response.json();
        console.log('Response data:', data);

        if (!response.ok) {
          showMessage('loginError', `❌ ${data.error}`);
          return;
        }

        showMessage('loginSuccess', '✓ Login successful! Redirecting...', false);
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        console.log('Token saved:', data.token);
        console.log('User saved:', data.user);

        setTimeout(() => {
          window.location.href = '/dashboard.html';
        }, 3000);
      } catch (error) {
        console.error('Fetch error:', error);
        showMessage('loginError', `❌ Network error: ${error.message}`);
      } finally {
        loginBtn.disabled = false;
        loginLoading.classList.remove('show');
      }
    }

    async function handleRegister(event) {
      event.preventDefault();
      clearMessages();

      const name = document.getElementById('registerName').value;
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;
      const confirm = document.getElementById('registerConfirm').value;
      const registerBtn = document.getElementById('registerBtn');
      const registerLoading = document.getElementById('registerLoading');

      // Validate email domain
      if (!email.endsWith('@apexingoodcompany.co.uk')) {
        showMessage('registerError', '❌ Only @apexingoodcompany.co.uk emails are allowed');
        return;
      }

      // Validate passwords match
      if (password !== confirm) {
        showMessage('registerError', '❌ Passwords do not match');
        return;
      }

      registerBtn.disabled = true;
      registerLoading.classList.add('show');

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, name })
        });

        const data = await response.json();

        if (!response.ok) {
          showMessage('registerError', `❌ ${data.error}`);
          return;
        }

        showMessage('registerSuccess', '✓ Registration successful! You can now login.', false);
        setTimeout(() => toggleForms(), 2000);
      } catch (error) {
        showMessage('registerError', `❌ Error: ${error.message}`);
      } finally {
        registerBtn.disabled = false;
        registerLoading.classList.remove('show');
      }
    }
  </script>
</body>
</html>
